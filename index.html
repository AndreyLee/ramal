<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Assinatura de E-mail Institucional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sistema de Assinatura</h1>
    </header>
    <main>
        <div class="card">
            <p class="description">Preencha os campos abaixo para gerar sua assinatura de email institucional.</p>
            <form id="signature-form">
                <div class="form-group">
                    <label for="name">Nome:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="sector">Setor:</label>
                    <input type="text" id="sector" name="sector" required>
                </div>
                <div class="form-group">
                    <label for="extension">Ramal:</label>
                    <input type="text" id="extension" name="extension" required>
                </div>
                <button type="submit" id="generate-btn">Gerar Assinatura</button>
            </form>
            <div class="preview-area" id="preview-area">
                <!-- A assinatura gerada será exibida aqui -->
            </div>
            <button id="copy-btn">Copiar para Área de Transferência</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
